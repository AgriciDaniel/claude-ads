version: 2
updates:
  # Python dependencies are hash-locked and pinned by the release inventory, so
  # they change only in a reviewed release. A limit of 0 turns off routine
  # version-update pull requests; Dependabot security updates still open.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies

  # One grouped pull request per month for minor and patch action updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 2
    labels:
      - dependencies
