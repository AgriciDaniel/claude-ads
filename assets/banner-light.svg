<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="548" viewBox="0 0 1200 548" role="img" aria-labelledby="t d">
<title id="t">Claude Ads: every ad account, one command line</title>
<desc id="d">Claude Ads covers 12 ad platforms with 33 skills and one /ads command. It is read only by default and every finding is backed by evidence.</desc>
<style>
text{font-family:Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif} .m{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes type{from{width:0}to{width:var(--w)}}
@keyframes show{from{opacity:0}to{opacity:1}}
.r{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.cur{animation:blink 1.1s steps(1) infinite}
.s{animation:show .4s ease-out both}
.ty{animation:type 1.2s steps(19) .5s both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1200" height="548" rx="22" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="1199" height="547" rx="21.5" fill="none" stroke="#E3E3E9"/>
<text x="72" y="168" font-size="80" font-weight="800" fill="#17171C" text-anchor="start" class="r" style="animation-delay:0s">Every ad account.</text>
<text x="72" y="256" font-size="80" font-weight="800" fill="#17171C" class="r" style="animation-delay:.12s">One command line<tspan fill="#E4684B">.</tspan></text>
<text x="72" y="312" font-size="24" font-weight="400" fill="#5B5F6B" text-anchor="start" class="r" style="animation-delay:0.25s">12 platforms, 33 skills, one /ads command. Read only by default,</text>
<text x="72" y="346" font-size="24" font-weight="400" fill="#5B5F6B" text-anchor="start" class="r" style="animation-delay:0.3s">and every finding is backed by evidence.</text>
<rect x="72" y="372" width="1056" height="108" rx="14" fill="#FAFAFB" stroke="#E3E3E9" class="r" style="animation-delay:0.35s"/>
<text x="100" y="416" font-size="21" font-weight="500" fill="#5B5F6B" text-anchor="start" class="m">&gt;</text>
<clipPath id="c"><rect x="124" y="394" height="34" class="ty" style="--w:230px" width="230"/></clipPath>
<g clip-path="url(#c)"><text x="124" y="416" font-size="21" font-weight="600" fill="#2B2D36" text-anchor="start" class="m">/ads audit google</text>
</g>
<rect x="360" y="398" width="11" height="24" rx="2" fill="#E4684B" class="cur"/>
<text x="100" y="456" font-size="17" font-weight="400" fill="#5B5F6B" text-anchor="start" class="m s" style="animation-delay:1.9s">google: search terms clean, 2 findings at medium confidence</text>
<text x="1104" y="416" font-size="12" font-weight="500" fill="#8A8F9C" text-anchor="end" class="m">EXAMPLE OUTPUT</text>
<text x="72" y="518" font-size="15" font-weight="400" fill="#5B5F6B" text-anchor="start" class="m">MIT licensed  /  12 ad platforms  /  33 skills  /  read only by default</text>
</svg>
