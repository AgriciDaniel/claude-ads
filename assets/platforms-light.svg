<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="574" viewBox="0 0 1200 574" role="img" aria-labelledby="t d">
<title id="t">Supported ad platforms</title>
<desc id="d">Google, Meta, YouTube, LinkedIn, TikTok, Microsoft, Reddit, Snapchat, X, Apple, Amazon and Pinterest.</desc>
<style>
text{font-family:Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif} .m{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes type{from{width:0}to{width:var(--w)}}
@keyframes show{from{opacity:0}to{opacity:1}}
.r{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.cur{animation:blink 1.1s steps(1) infinite}
.s{animation:show .4s ease-out both}
.ty{animation:type 1.2s steps(19) .5s both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
