<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">How Claude Ads works</title>
<desc id="d">Three steps: tell it about your business, give it your data, then read the audit.</desc>
<rect width="1200" height="440" rx="20" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="1199" height="439" rx="19.5" fill="none" stroke="#E3E3E9"/>
<text x="72" y="78" font-size="14" font-weight="700" fill="#D4623C" text-anchor="start" letter-spacing="2">HOW IT WORKS</text>
<text x="72" y="124" font-size="36" font-weight="800" fill="#17171C" text-anchor="start">From question to audit in three steps</text>
<rect x="72" y="160" width="336" height="232" rx="18" fill="#FFFFFF" stroke="#E3E3E9"/>
<rect x="96" y="184" width="52" height="52" rx="14" fill="#FBEAE3"/>
<text x="122" y="218" font-size="20" font-weight="800" fill="#D4623C" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">01</text>
<text x="96" y="282" font-size="21" font-weight="700" fill="#17171C" text-anchor="start">Tell it about your business</text>
<text x="96" y="316" font-size="16" font-weight="400" fill="#5B5F6B" text-anchor="start">Run /ads setup and answer a few</text>
<text x="96" y="340" font-size="16" font-weight="400" fill="#5B5F6B" text-anchor="start">questions about your goal, your</text>
<text x="96" y="364" font-size="16" font-weight="400" fill="#5B5F6B" text-anchor="start">budget and your platforms.</text>
<rect x="432" y="160" width="336" height="232" rx="18" fill="#FFFFFF" stroke="#E3E3E9"/>
<rect x="456" y="184" width="52" height="52" rx="14" fill="#FBEAE3"/>
<text x="482" y="218" font-size="20" font-weight="800" fill="#D4623C" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">02</text>
<text x="456" y="282" font-size="21" font-weight="700" fill="#17171C" text-anchor="start">Give it your data</text>
<text x="456" y="316" font-size="16" font-weight="400" fill="#5B5F6B" text-anchor="start">Add an account export,</text>
<text x="456" y="340" font-size="16" font-weight="400" fill="#5B5F6B" text-anchor="start">screenshots or a pasted summary.</text>
<text x="456" y="364" font-size="16" font-weight="400" fill="#5B5F6B" text-anchor="start">Never passwords or API keys.</text>
<rect x="792" y="160" width="336" height="232" rx="18" fill="#FFFFFF" stroke="#E3E3E9"/>
<rect x="816" y="184" width="52" height="52" rx="14" fill="#FBEAE3"/>
<text x="842" y="218" font-size="20" font-weight="800" fill="#D4623C" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">03</text>
<text x="816" y="282" font-size="21" font-weight="700" fill="#17171C" text-anchor="start">Read the audit</text>
<text x="816" y="316" font-size="16" font-weight="400" fill="#5B5F6B" text-anchor="start">See what passed, what failed, and</text>
<text x="816" y="340" font-size="16" font-weight="400" fill="#5B5F6B" text-anchor="start">what it could not check, each</text>
<text x="816" y="364" font-size="16" font-weight="400" fill="#5B5F6B" text-anchor="start">with its evidence.</text>
</svg>
